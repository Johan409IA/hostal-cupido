name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, formato y tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint del frontend
        run: pnpm lint

      - name: Formato del frontend
        run: pnpm format:check

      - name: Tests del frontend
        run: pnpm test

      - name: Formato del backend
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy del backend
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Tests del backend
        run: cargo test
        working-directory: src-tauri

  build:
    name: Build de la app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build de la app
        run: pnpm tauri build --no-bundle
